<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>okwin</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      height: 100vh;
      background: radial-gradient(circle at top, #141e30, #243b55);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: 'Segoe UI', sans-serif;
      color: white;
    }

    .logo {
      font-size: 2rem;
      font-weight: bold;
      margin-bottom: 40px;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.2);
      letter-spacing: 2px;
    }

    .container {
      width: 100%;
      max-width: 400px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    a.button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px;
      background: linear-gradient(135deg, #ff416c, #ff4b2b);
      color: white;
      text-align: center;
      text-decoration: none;
      font-size: 1.3rem;
      font-weight: bold;
      border-radius: 12px;
      box-shadow: 0 8px 20px rgba(255, 65, 108, 0.3);
      transition: transform 0.2s ease, box-shadow 0.3s ease;
    }

    a.button:hover {
      transform: scale(1.05);
      box-shadow: 0 10px 25px rgba(255, 65, 108, 0.5);
    }

    .emoji {
      display: inline-block;
      font-size: 1.6rem;
    }

    .emoji.link {
      animation: bounce 1.5s infinite;
    }

    .emoji.bot {
      animation: shake 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    @keyframes shake {
      0%, 100% { transform: rotate(0); }
      25% { transform: rotate(8deg); }
      75% { transform: rotate(-8deg); }
    }
  </style>
</head>
<body>
  <div class="logo">OK-WIN</div>
  <div class="container">
    <!-- Replace links below -->
    <a href="https://okwinslots1.com/#/register?invitationCode=288351655891" class="button" target="_blank">
      <span class="emoji link">🔗</span> Register
    </a>
    <a href="https://telegram.me/Profit_with_sachin_bot" class="button" target="_blank">
      <span class="emoji bot">🤖</span> Prediction Bot
    </a>
  </div>
</body>
</html>
